name: Verify Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate documentation and repository
        run: python3 scripts/validate_repository.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision Android SDK tools and packages
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platforms;android-37.1 build-tools;36.0.0 platform-tools'
      - name: Unit tests, Android build, lint, and instrumentation compilation
        run: ./gradlew :core:domain:test :core:data:testDebugUnitTest :app:assembleDebug :app:lintDebug :core:data:assembleDebugAndroidTest --console=plain
      - name: Resolved runtime dependencies
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --console=plain > runtime-dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-and-reports
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            core/data/build/reports/tests/testDebugUnitTest/
            core/domain/build/reports/tests/test/
            core/data/schemas/
            runtime-dependencies.txt
