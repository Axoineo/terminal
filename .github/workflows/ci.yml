name: Verify Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate documentation and repository
        run: |
          python3 scripts/validate_repository.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Provision Android SDK tools and packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platforms;android-37.1 build-tools;36.0.0 platform-tools'
      - name: Unit tests, Android build, lint, and instrumentation compilation
        run: ./gradlew :core:domain:test :core:data:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest --console=plain
      - name: Resolved runtime dependencies
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --console=plain > runtime-dependencies.txt
          ./gradlew :app:exportRuntimeArtifacts --console=plain
      - name: Inspect APK permissions, native alignment and notices
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk > app/build/reports/apk-permissions.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk > app/build/reports/apk-alignment.txt
          python3 - <<'PY'
          import pathlib, zipfile
          source = pathlib.Path('app/src/main/assets/third_party')
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              for asset in source.iterdir():
                  assert apk.read('assets/third_party/' + asset.name) == asset.read_bytes(), asset.name
              native = [name for name in apk.namelist() if name.endswith('.so')]
              pathlib.Path('app/build/reports/apk-native-files.txt').write_text('\n'.join(native) + '\n')
          print('Packaged notices match source assets.')
          PY
      - name: Check resolved runtime dependencies against OSV
        run: python3 scripts/audit_runtime_dependencies.py app/build/reports/runtime-artifacts.tsv --output app/build/reports/runtime-osv-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-debug-and-reports
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            core/data/build/reports/tests/testDebugUnitTest/
            core/domain/build/reports/tests/test/
            core/data/schemas/
            runtime-dependencies.txt
            app/build/reports/runtime-artifacts.tsv
            app/build/reports/runtime-osv-report.json
            app/build/reports/apk-*.txt
  android-device:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platforms;android-37.1 build-tools;36.0.0 platform-tools emulator system-images;android-26;google_apis;x86_64'
      - name: Start Android 8 emulator and run device checks
        run: |
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name terminal-test --package 'system-images;android-26;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd terminal-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
          ./gradlew :core:data:connectedDebugAndroidTest :app:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-device-reports
          retention-days: 7
          path: |
            app/build/reports/androidTests/
            core/data/build/reports/androidTests/
            /tmp/emulator.log
